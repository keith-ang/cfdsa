---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: umamidb-deploy
  namespace: umamins
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: umamidb
      env: dev
  template: 
    metadata:
      name: umamidb
      namespace: umamins
      labels:
        app: umamidb
        env: dev
    spec:
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: umamidb-pvc
      containers:
      - name: umamidb-container
        image: postgres:16-alpine
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data-volume
        envFrom:
          - secretRef:
              name: umamidb-secret
          - configMapRef:
              name: umamidb-cm
        ports:
        - name: umamidb-port
          containerPort: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: umamidb-pvc
  namespace: umamins
spec:
  accessModes:
  - ReadWriteOnce
  resources:  
    requests:
      storage: 1Gi
  storageClassName: standard

--- 
apiVersion: v1
kind: Secret
metadata:
  name: umamidb-secret
  namespace: umamins
data:
  POSTGRES_PASSWORD: bXlkYnBhc3N3b3Jk

--- 
apiVersion: v1
kind: ConfigMap
metadata:
  name: umamidb-cm
  namespace: umamins
data:
  POSTGRES_USER: umami
  POSTGRES_DB: umami
  PGDATA: /var/lib/postgresql/data/pgdata

--- 
apiVersion: v1
kind: Service
metadata:
  name: umamidb-svc
  namespace: umamins
spec:
  type: ClusterIP
  selector:
    app: umamidb
    env: dev
  ports:
  - port: 5432
    targetPort: umamidb-port

