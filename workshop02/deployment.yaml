apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns
spec:
  replicas: 3
  selector:
    matchLabels:
      env: dev
  template:
    metadata:
      name: bggapp
      namespace: bggns
      labels:
        env: dev

    spec:
      containers:
      - name: bggapp-container
        image: stackupiss/bgg-backend:v2
        imagePullPolicy: IfNotPresent
        ports:
        - name: bggapp-port
          containerPort: 3000
        envFrom:
          - configMapRef:
              name: bggapp-cm
          - secretRef:
              name: bggapp-secret

        livenessProbe:
          httpGet:
            path: /healthz
            port: bggapp-port
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
          periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: bggdb-svc
  namespace: bggns
spec:
  type: ClusterIP
  # we forward traffic to these pods
  selector:
    name: bggdb-container
  ports:
  - port: 3306
    targetPort: bggdb-port

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  type: NodePort
  selector:
    env: dev              
  ports:
  - port: 3000
    targetPort: bggapp-port
    nodePort: 30001