volumes:
  # docker volume create data-vol
  data-vol:

networks:
  # docker network create mynet
  mynet:
    name: mynet

services:
  mydb:
    # docker run -d --volume type=volume,src=data-vol,dst=/var/lib/sql --name=mydb stackupiss/northwind-db:v1
    image: stackupiss/northwind-db:v1
    container_name: mydb
    networks:
      - mynet
    volumes:
      - data-vol:/var/lib/mysql

  # docker run -d -p 8080:3000 --name=myapp --network=mynet \
  # -e DB_HOST=db -d DB_USER=root -d DB_PASSWORD=changeit stackupiss/northwind-app:v1
  myapp:
    image: stackupiss/northwind-app:v1
    container_name: myapp
    environment:
      DB_HOST: mydb
      DB_USER: root
      DB_PASSWORD: changeit
    ports:
      - 8080:3000
    networks:
      - mynet

